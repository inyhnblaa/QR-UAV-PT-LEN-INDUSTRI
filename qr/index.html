<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Video UAV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: system-ui, sans-serif;
    }
    .card {
      background: #fff;
      padding: 28px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #0055a5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="card">
    <strong>Mengalihkan ke video UAV<br>PT LEN Industri</strong>
    <div class="loader"></div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "go.html?t=" + Date.now();
    }, 2500);
  </script>
</body>
</html>
