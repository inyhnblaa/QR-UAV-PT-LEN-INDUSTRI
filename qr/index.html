<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Anti cache -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fdf4f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      color: #7a1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      padding: 28px 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 700;
      color: #b13a3e;
    }

    .subtitle {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #f1c9c9;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 26px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #b13a3e;
      animation: loading 3s linear forwards;
    }

    @keyframes loading {
      to { width: 100%; }
    }

    .image {
      width: 100%;
      border-radius: 18px;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <h1>Hold on!</h1>
    <div class="subtitle">
      You’re being redirected to the UAV video…
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress">
      <div class="bar"></div>
    </div>

    <!-- GAMBAR UI -->
    <img src="uav-ui.jpg" alt="UAV Illustration" class="image">
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "go.html?t=" + Date.now();
    }, 3000); // sesuai durasi progress bar
  </script>
</body>
</html>
