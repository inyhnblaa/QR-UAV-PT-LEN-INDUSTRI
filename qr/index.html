<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Video UAV</title>

  <!-- Anti cache -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
    }

    .card {
      background: #ffffff;
      width: 90%;
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .line {
      width: 48px;
      height: 3px;
      background: #0055a5;
      margin: 0 auto 16px;
      border-radius: 2px;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 22px;
    }

    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #0055a5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>

  <script>
    setTimeout(function () {
      window.location.replace(
        "https://www.youtube.com/watch?v=ID_VIDEO_BARU"
      );
    }, 2000);
  </script>
</head>

<body>
  <div class="card">
    <div class="line"></div>
    <div class="title">Video UAV</div>
    <div class="subtitle">Mengalihkan ke video UAV PT LEN Industri</div>
    <div class="loader"></div>
    <div class="footer">PT LEN Industri</div>
  </div>
</body>
</html>
