<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

 <style>
  body {
    margin: 0;
    height: 100vh;

    /* DEFAULT: PORTRAIT */
    background: url("uav-ui-portrait.jpg") no-repeat center top;
    background-size: cover;
  }

  /* PROGRESS BAR */
  .progress-wrapper {
    position: absolute;
    top: 180px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    max-width: 320px;
  }

  .progress {
    width: 100%;
    height: 8px;
    background: rgba(177, 58, 62, 0.25);
    border-radius: 6px;
    overflow: hidden;
  }

  .bar {
    width: 0%;
    height: 100%;
    background: #b13a3e;
    animation: load 3s linear forwards;
  }

  @keyframes load {
    to { width: 100%; }
  }

  /* ===== LANDSCAPE ===== */
  @media screen and (orientation: landscape) {
    body {
      background: url("uav-ui-landscape.jpg") no-repeat center center;
      background-size: cover;
    }

    .progress-wrapper {
      top: auto;
      bottom: 40px;
      width: 40%;
      max-width: 420px;
    }
  }
</style>
</head>

<body>
  <div class="progress-wrapper">
    <div class="progress">
      <div class="bar"></div>
    </div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "go.html?t=" + Date.now();
    }, 3000);
  </script>
</body>
</html>
