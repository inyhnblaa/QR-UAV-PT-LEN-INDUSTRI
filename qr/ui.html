<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Anti cache -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    /* ===== BASE ===== */
    body {
      margin: 0;
      height: 100vh;
      background: #fdf4f1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== FRAME PORTRAIT (9:16) ===== */
    .frame {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;

      background: url("uav-ui-portrait.jpg") no-repeat center center;
      background-size: contain;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-wrapper {
      position: absolute;
      top: 22%;              /* di bawah teks (Canva) */
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: rgba(177, 58, 62, 0.25);
      border-radius: 6px;
      overflow: hidden;
    }

    .bar {
      width: 0%;
      height: 100%;
      background: #b13a3e;
      animation: load 3s linear forwards;
    }

    @keyframes load {
      to { width: 100%; }
    }

    /* ===== LANDSCAPE (16:9) ===== */
    @media screen and (orientation: landscape) {
      .frame {
        width: 100vw;
        height: auto;
        aspect-ratio: 16 / 9;

        background: url("uav-ui-landscape.jpg") no-repeat center center;
        background-size: contain;
      }

      .progress-wrapper {
        top: 20%;
        width: 40%;
      }
    }
  </style>
</head>

<body>
  <!-- FULL UI GAMBAR -->
  <div class="frame">
    <!-- PROGRESS BAR -->
    <div class="progress-wrapper">
      <div class="progress">
        <div class="bar"></div>
      </div>
    </div>
  </div>

  <!-- REDIRECT -->
  <script>
    setTimeout(() => {
      window.location.href = "go.html?t=" + Date.now();
    }, 3000);
  </script>
</body>
</html>
