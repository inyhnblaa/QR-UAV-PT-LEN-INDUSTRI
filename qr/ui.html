<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Anti cache -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    /* ===== BASE + SAFE AREA IPHONE ===== */
    body {
      margin: 0;
      height: 100vh;
      background: #fdf4f1;
      display: flex;
      align-items: center;
      justify-content: center;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ===== FADE IN & OUT ===== */
    .fade {
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
    }

    .fade-out {
      animation: fadeOut 0.4s ease-in forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }

    /* ===== FRAME PORTRAIT (9:16) ===== */
    .frame {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;

      background: url("uav-ui-portrait.jpg") no-repeat center center;
      background-size: contain;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-wrapper {
      position: absolute;
      top: 25%;               /* PUNYA KAMU */
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: rgba(177, 58, 62, 0.25);
      border-radius: 6px;
      overflow: hidden;
    }

    .bar {
      width: 0%;
      height: 100%;
      background: #b13a3e;
      animation: load linear forwards;
    }

    @keyframes load {
      to { width: 100%; }
    }

    /* ===== LANDSCAPE (16:9) ===== */
    @media screen and (orientation: landscape) {
      .frame {
        width: 100vw;
        height: auto;
        aspect-ratio: 16 / 9;

        background: url("uav-ui-landscape.jpg") no-repeat center center;
        background-size: contain;
      }

      .progress-wrapper {
        top: 20%;             /* PUNYA KAMU */
        width: 40%;
      }
    }
  </style>
</head>

<body>
  <!-- FULL UI -->
  <div class="frame fade" id="ui">
    <div class="progress-wrapper">
      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>
    </div>
  </div>

  <script>
    /* ===== KONFIG ===== */
    const DURATION = 3000; // ms (sinkron bar & redirect)
    const REDIRECT_URL = "go.html";

    /* ===== PRELOAD IMAGE (2) ===== */
    ["uav-ui-portrait.jpg", "uav-ui-landscape.jpg"].forEach(src => {
      const img = new Image();
      img.src = src;
    });

    /* ===== SYNC PROGRESS BAR (3) ===== */
    const bar = document.getElementById("bar");
    bar.style.animationDuration = DURATION + "ms";

    /* ===== FADE OUT + REDIRECT (1) ===== */
    setTimeout(() => {
      document.getElementById("ui").classList.add("fade-out");
    }, DURATION - 400);

    setTimeout(() => {
      window.location.href = REDIRECT_URL + "?t=" + Date.now();
    }, DURATION);
  </script>
</body>
</html>
